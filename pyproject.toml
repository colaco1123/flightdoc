[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flightdoc"
version = "0.1.0"
description = "Find out why your drone crashed: automatic diagnosis of ArduPilot, PX4, Betaflight and INAV logs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shay Colaco" }]
requires-python = ">=3.10"
keywords = ["drone", "uav", "ardupilot", "px4", "betaflight", "inav", "blackbox", "crash", "log analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "pyulog>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pymavlink>=2.4"]

[project.scripts]
flightdoc = "flightdoc.cli:main"

[project.urls]
Homepage = "https://github.com/colaco1123/flightdoc"
Issues = "https://github.com/colaco1123/flightdoc/issues"

[tool.setuptools.packages.find]
include = ["flightdoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
